# Un tag vX.Y.Z construit l'image et la pousse sur GHCR en X.Y.Z + latest.
# Unraid détecte ensuite la mise à jour de ghcr.io/666dsa666/nestvideobackup:latest.
name: image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/666dsa666/nestvideobackup:${{ steps.v.outputs.version }}
            ghcr.io/666dsa666/nestvideobackup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Déclenchement : tag vX.Y.Z.
